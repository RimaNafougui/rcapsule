<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rcapsule Import</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Tokens (mirrors globals.css + tailwind.config.js) ── */
      :root {
        --ink:        #171717;
        --bg:         #FFFFFF;
        --surface:    #FAFAFA;
        --surface-2:  #F5F5F5;
        --border:     #E5E5E5;
        --border-md:  #D4D4D4;
        --muted:      #737373;
        --muted-2:    #A3A3A3;
        --danger:     #DC2626;
        --success:    #16A34A;
        --mono:       'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --sans:       -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --t-fast:     150ms cubic-bezier(0.4, 0, 0.2, 1);
        --t-normal:   200ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ── Reset ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 380px;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      .header {
        background: var(--ink);
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--ink);
      }

      .logo {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #FFFFFF;
      }

      .version {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted-2);
      }

      .offline-badge {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: var(--danger);
        color: #FFFFFF;
        padding: 2px 8px;
      }

      /* ── Container ── */
      .container { padding: 20px; }

      /* ── Intro text ── */
      .intro {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 20px;
        line-height: 1.6;
        padding-left: 12px;
        border-left: 1px solid var(--ink);
      }

      .intro strong { color: var(--ink); font-weight: 600; }

      /* ── Buttons ── */
      .btn {
        display: block;
        width: 100%;
        height: 44px;
        padding: 0 16px;
        border: none;
        border-radius: 0;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        cursor: pointer;
        transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast);
        background: transparent;
      }

      .btn-primary {
        background: var(--ink);
        color: #FFFFFF;
      }
      .btn-primary:hover:not(:disabled) { background: #404040; }
      .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

      .btn-secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
        margin-top: 8px;
      }
      .btn-secondary:hover:not(:disabled) { background: var(--ink); color: #FFFFFF; }
      .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ── Utility ── */
      .hidden { display: none !important; }

      /* ── Form layout ── */
      .form-group { margin-bottom: 14px; }

      .label {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .form-group:focus-within .label { color: var(--ink); }

      .input,
      select,
      textarea {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 0;
        font-family: var(--sans);
        font-size: 13px;
        background: var(--bg);
        color: var(--ink);
        transition: border-color var(--t-fast);
        appearance: none;
        -webkit-appearance: none;
      }

      textarea {
        height: auto;
        min-height: 72px;
        padding: 10px 12px;
        resize: vertical;
        line-height: 1.5;
      }

      .input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--ink);
      }

      .input::placeholder,
      textarea::placeholder { color: var(--muted-2); }

      .flex-row {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      .flex-row .form-group { margin-bottom: 0; }

      /* ── Image preview ── */
      .img-container {
        width: 100%;
        aspect-ratio: 3 / 4;
        background: var(--surface-2);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--border);
        position: relative;
      }

      .img-preview {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .img-placeholder {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted-2);
      }

      /* ── Wishlist checkbox ── */
      .checkbox-wrapper {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin: 16px 0;
        padding: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: border-color var(--t-fast);
      }

      .checkbox-wrapper:hover { border-color: var(--ink); }
      .checkbox-wrapper:has(input:checked) { border-color: var(--ink); background: var(--surface); }

      .checkbox-wrapper input[type="checkbox"] {
        margin-top: 2px;
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: var(--ink);
        border-radius: 0;
        flex-shrink: 0;
      }

      .checkbox-label { flex: 1; cursor: pointer; }

      .checkbox-title {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        display: block;
        margin-bottom: 3px;
        color: var(--ink);
      }

      .checkbox-desc {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.4;
      }

      /* ── Status message ── */
      #status {
        margin-top: 12px;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        min-height: 18px;
        padding: 6px 10px;
        transition: color var(--t-fast);
      }

      .error   { color: var(--danger); }
      .success { color: var(--success); }
      .loading { color: var(--muted); }

      /* ── Shortcut hint ── */
      .shortcut-hint {
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 0.1em;
        color: var(--muted-2);
        text-align: center;
        margin-top: 12px;
        text-transform: uppercase;
      }

      .shortcut-hint kbd {
        background: var(--surface-2);
        border: 1px solid var(--border-md);
        border-radius: 0;
        padding: 1px 5px;
        font-family: var(--mono);
        font-size: 9px;
        margin: 0 2px;
      }

      /* ── Scrollbar ── */
      select::-webkit-scrollbar { width: 8px; }
      select::-webkit-scrollbar-track { background: var(--surface); }
      select::-webkit-scrollbar-thumb { background: var(--border-md); }
      select::-webkit-scrollbar-thumb:hover { background: var(--muted); }

      /* ── Focus ring ── */
      .btn:focus-visible,
      .input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* ── View transitions ── */
      #scanView, #formView {
        animation: fadeUp 200ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="logo">Rcapsule / Import</span>
      <span id="offlineBadge" class="offline-badge" style="display: none">Offline</span>
      <span class="version">v1.0</span>
    </div>

    <div class="container">
      <!-- Scan View -->
      <div id="scanView">
        <p class="intro">
          Navigate to a product page on <strong>Zara</strong>,
          <strong>SSENSE</strong>, <strong>Aritzia</strong>,
          <strong>Grailed</strong>, <strong>Nike</strong>, <strong>H&M</strong>,
          or other supported retailers to automatically extract details.
        </p>
        <button id="scanBtn" class="btn btn-primary" aria-label="Scan current page for product details">
          Scan Current Page
        </button>
        <div class="shortcut-hint">
          Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> to scan from anywhere
        </div>
      </div>

      <!-- Form View -->
      <div id="formView" class="hidden">
        <div class="img-container">
          <img id="previewImg" src="" alt="Product preview" class="img-preview" style="display: none" />
          <span class="img-placeholder" id="imgPlaceholder">No Image</span>
        </div>

        <form id="productForm" onsubmit="return false;">
          <div class="form-group">
            <label class="label" for="inputName">Product Name</label>
            <input type="text" id="inputName" class="input" required aria-required="true" placeholder="Slim Fit Oxford Shirt" />
          </div>

          <div class="flex-row">
            <div class="form-group" style="flex: 1">
              <label class="label" for="inputBrand">Brand</label>
              <input type="text" id="inputBrand" class="input" placeholder="Zara" />
            </div>
            <div class="form-group" style="flex: 1">
              <label class="label" for="inputPrice">Price</label>
              <input type="text" id="inputPrice" class="input" placeholder="49.99" />
            </div>
          </div>

          <div class="flex-row">
            <div class="form-group" style="flex: 1">
              <label class="label" for="inputSize">Size</label>
              <input type="text" id="inputSize" class="input" placeholder="M" />
            </div>
            <div class="form-group" style="flex: 1.5">
              <label class="label" for="inputCategory">Category</label>
              <select id="inputCategory" class="input" aria-label="Product category">
                <option value="Uncategorized">— Select —</option>
                <option value="Activewear">Activewear</option>
                <option value="Bag">Bag</option>
                <option value="Beanie">Beanie</option>
                <option value="Belt">Belt</option>
                <option value="Blazer">Blazer</option>
                <option value="Blouse">Blouse</option>
                <option value="Bodysuit">Bodysuit</option>
                <option value="Bomber">Bomber</option>
                <option value="Boots">Boots</option>
                <option value="Bra">Bra</option>
                <option value="Bracelet">Bracelet</option>
                <option value="Cap">Cap</option>
                <option value="Card Holder">Card Holder</option>
                <option value="Cardigan">Cardigan</option>
                <option value="Co-ord Set">Co-ord Set</option>
                <option value="Coat">Coat</option>
                <option value="Corset">Corset</option>
                <option value="Crop Top">Crop Top</option>
                <option value="Dress">Dress</option>
                <option value="Earrings">Earrings</option>
                <option value="Flats">Flats</option>
                <option value="Hat">Hat</option>
                <option value="Heels">Heels</option>
                <option value="Hoodie">Hoodie</option>
                <option value="Jacket">Jacket</option>
                <option value="Jeans">Jeans</option>
                <option value="Jewelry">Jewelry</option>
                <option value="Joggers">Joggers</option>
                <option value="Jumpsuit">Jumpsuit</option>
                <option value="Leggings">Leggings</option>
                <option value="Loafers">Loafers</option>
                <option value="Pants">Pants</option>
                <option value="Puffer">Puffer</option>
                <option value="Ring">Ring</option>
                <option value="Romper">Romper</option>
                <option value="Sandals">Sandals</option>
                <option value="Scarf">Scarf</option>
                <option value="Shirt">Shirt</option>
                <option value="Shorts">Shorts</option>
                <option value="Skirt">Skirt</option>
                <option value="Slides">Slides</option>
                <option value="Sneakers">Sneakers</option>
                <option value="Sunglasses">Sunglasses</option>
                <option value="Sweater">Sweater</option>
                <option value="Sweatpants">Sweatpants</option>
                <option value="Sweatshirt">Sweatshirt</option>
                <option value="Swimwear">Swimwear</option>
                <option value="T-shirt">T-shirt</option>
                <option value="Tank Top">Tank Top</option>
                <option value="Tights">Tights</option>
                <option value="Trench">Trench</option>
                <option value="Trousers">Trousers</option>
                <option value="Tube Top">Tube Top</option>
                <option value="Underwear">Underwear</option>
                <option value="Vest">Vest</option>
                <option value="Watch">Watch</option>
                <option value="Socks">Socks</option>
                <option value="Pant">Pant</option>
              </select>
            </div>
          </div>

          <input type="hidden" id="inputLink" />
          <input type="hidden" id="inputImgUrl" />

          <div class="form-group">
            <label class="label" for="inputMaterials">Materials</label>
            <input type="text" id="inputMaterials" class="input" placeholder="100% Cashmere" />
          </div>

          <div class="form-group">
            <label class="label" for="inputDescription">Description</label>
            <textarea id="inputDescription" placeholder="Optional description"></textarea>
          </div>

          <div class="checkbox-wrapper">
            <input type="checkbox" id="inputWishlist" aria-describedby="wishlistDesc" />
            <label for="inputWishlist" class="checkbox-label">
              <span class="checkbox-title">Save to Wishlist</span>
              <span class="checkbox-desc" id="wishlistDesc">Item will not affect your total stats.</span>
            </label>
          </div>

          <button id="saveBtn" type="submit" class="btn btn-primary" aria-label="Add product to wardrobe">
            Add to Wardrobe
          </button>
          <button id="cancelBtn" type="button" class="btn btn-secondary" aria-label="Cancel and return to scan">
            Cancel
          </button>

          <div class="shortcut-hint">
            <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to save &nbsp;·&nbsp; <kbd>Esc</kbd> to cancel
          </div>
        </form>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <button id="clearCacheBtn" class="btn btn-secondary" style="margin: 0 20px 16px; width: calc(100% - 40px);">
      Clear Cache
    </button>

    <script src="popup.js"></script>
  </body>
</html>
