<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Chips — sharp + pill</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:220px}</style>
</head><body><div class="card">
  <div class="eyebrow">Components · Chips · two flavors only</div>
  <div class="col" style="gap:10px">
    <div class="row between"><span class="mono" style="font-size:10px;color:var(--mu);letter-spacing:0.18em">SHARP · CATEGORY / FILTER</span></div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <span class="chip-sharp on">Outerwear</span>
      <span class="chip-sharp">Knitwear</span>
      <span class="chip-sharp">Tailoring</span>
      <span class="chip-sharp">Denim</span>
      <span class="chip-sharp">Footwear</span>
    </div>
    <div class="divider"></div>
    <div class="row between"><span class="mono" style="font-size:10px;color:var(--mu);letter-spacing:0.18em">PILL · STATUS ONLY</span></div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <span class="chip-pill">archived</span>
      <span class="chip-pill warn">worn 37×</span>
      <span class="chip-pill outline">new</span>
    </div>
  </div>
</div></body></html>
