<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Modal — sharp header</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:280px}</style>
</head><body><div class="card">
  <div class="eyebrow">Components · Modal · radius 0 · no shadow</div>
  <div style="border:1px solid var(--bd);background:var(--bg);padding:24px 28px;max-width:520px">
    <div class="row between" style="margin-bottom:18px">
      <span class="eyebrow">Confirm</span>
      <span style="font-size:18px;line-height:1;color:var(--mu)">×</span>
    </div>
    <div class="serif" style="font-size:34px;font-weight:400;line-height:1.05;letter-spacing:-0.015em">Delete this look?</div>
    <div style="font-size:14px;color:var(--mu);margin-top:10px">This cannot be undone.</div>
    <div class="row" style="gap:10px;margin-top:20px">
      <button class="btn-danger" style="height:40px;font-size:11px;padding:0 20px">Delete</button>
      <button class="btn-ghost" style="height:40px;font-size:11px">Cancel</button>
    </div>
  </div>
</div></body></html>
