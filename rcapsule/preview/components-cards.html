<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Cards — border, no shadow, no radius</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:280px}</style>
</head><body><div class="card">
  <div class="eyebrow">Components · Cards</div>
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="flex:1;background:var(--bg);border:1px solid var(--bd);padding:16px">
      <div class="eyebrow" style="margin-bottom:8px">Outerwear · Wool</div>
      <div style="font-size:18px;font-weight:300">Charcoal overcoat</div>
      <div style="font-size:11px;color:var(--mu);margin-top:6px;font-family:var(--mono)">$16.21 / WEAR</div>
    </div>
    <div style="flex:1;background:var(--bg);border:1px solid var(--fg);padding:16px;position:relative">
      <div style="position:absolute;top:8px;right:8px" class="mono" style="font-size:9px;color:var(--mu)">HOVER</div>
      <div class="eyebrow" style="margin-bottom:8px">Knitwear · Wool</div>
      <div style="font-size:18px;font-weight:300">Mohair crewneck</div>
      <div style="font-size:11px;color:var(--mu);margin-top:6px;font-family:var(--mono)">$24.10 / WEAR</div>
    </div>
    <div style="flex:1;background:var(--s1);border:1px solid var(--bd);padding:16px">
      <div class="eyebrow" style="margin-bottom:8px">On surface</div>
      <div style="font-size:18px;font-weight:300">Suede chore</div>
      <div style="font-size:11px;color:var(--mu);margin-top:6px;font-family:var(--mono)">$36.40 / WEAR</div>
    </div>
  </div>
  <div style="font-size:11px;color:var(--mu);font-family:var(--mono)">Hover darkens the border. Frame never moves. Image inside may scale 1.03.</div>
</div></body></html>
