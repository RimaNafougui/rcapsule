<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Cost-per-wear display</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:280px}</style>
</head><body><div class="card dark">
  <div class="eyebrow">Components · The CPW number</div>
  <div class="row" style="gap:22px;align-items:baseline">
    <div class="col">
      <span class="eyebrow" style="margin-bottom:8px">Purchase</span>
      <span class="num" style="font-size:44px;color:#FAFAF7">$600</span>
    </div>
    <div style="font-size:28px;color:#8E8E88;font-weight:200">÷</div>
    <div class="col">
      <span class="eyebrow" style="margin-bottom:8px">Wears</span>
      <span class="num" style="font-size:44px;color:#FAFAF7">37</span>
    </div>
    <div style="font-size:28px;color:#8E8E88;font-weight:200">=</div>
    <div class="col">
      <span class="eyebrow" style="margin-bottom:8px">Cost / wear</span>
      <span class="num" style="font-size:56px;color:#FAFAF7;font-weight:300">$16.21</span>
    </div>
  </div>
  <div style="font-size:11px;color:#8E8E88;font-family:var(--mono)">JetBrains Mono · tabular-nums · display scale</div>
</div></body></html>
