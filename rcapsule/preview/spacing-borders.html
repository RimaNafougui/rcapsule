<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Borders — 1px hairline + strong</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:220px}</style>
</head><body><div class="card">
  <div class="eyebrow">Spacing · Borders</div>
  <div class="col" style="gap:14px">
    <div class="row between"><span class="mono" style="font-size:11px;text-transform:uppercase;letter-spacing:0.18em">Hairline · #E5E3DC</span><span class="mono" style="font-size:10px;color:var(--mu)">tables, dividers</span></div>
    <div class="divider"></div>
    <div class="row between"><span class="mono" style="font-size:11px;text-transform:uppercase;letter-spacing:0.18em">Strong · #0A0A0A</span><span class="mono" style="font-size:10px;color:var(--mu)">section rules · 1×–2× per page</span></div>
    <div class="divider-strong"></div>
    <div style="font-size:11px;color:var(--mu);font-family:var(--mono)">Always 1px. Never border-black directly — use border-foreground.</div>
  </div>
</div></body></html>
