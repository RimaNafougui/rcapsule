<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Loading — spinner only</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:200px}</style>
</head><body><div class="card">
  <div class="eyebrow">Components · Loading</div>
  <div class="row" style="gap:24px;align-items:center">
    <div style="width:18px;height:18px;border:1.5px solid var(--bd);border-top-color:var(--fg);border-radius:50%;animation:spin 0.9s linear infinite"></div>
    <span class="mono" style="font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:0.18em">Loading…</span>
  </div>
  <div style="font-size:12px;color:var(--mu);max-width:520px">A centered &lt;Spinner /&gt; only. No skeleton loaders unless explicitly requested. The spinner is the only element in the UI permitted to rotate.</div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div></body></html>
