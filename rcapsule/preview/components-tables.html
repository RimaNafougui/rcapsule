<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Tables — hairlines, no zebra</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:280px}</style>
</head><body><div class="card">
  <div class="eyebrow">Components · Tables · row separator only</div>
  <div>
    <div class="row" style="padding:8px 4px;border-bottom:1px solid var(--fg)">
      <div style="flex:3" class="mono" style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:0.20em">Item</div>

      <div style="flex:1;text-align:right" class="mono" style="font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:0.20em">CPW</div>
    </div>
    
      <div class="row" style="padding:12px 4px;border-bottom:1px solid var(--bd)">
        <div style="flex:3;font-size:14px">Charcoal overcoat</div>
        <div style="flex:1;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">37×</div>
        <div style="flex:1;text-align:right;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">$16.21</div>
      </div>
    
      <div class="row" style="padding:12px 4px;border-bottom:1px solid var(--bd)">
        <div style="flex:3;font-size:14px">Mohair crewneck</div>
        <div style="flex:1;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">13×</div>
        <div style="flex:1;text-align:right;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">$24.10</div>
      </div>
    
      <div class="row" style="padding:12px 4px;border-bottom:1px solid var(--bd)">
        <div style="flex:3;font-size:14px">Selvedge denim</div>
        <div style="flex:1;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">82×</div>
        <div style="flex:1;text-align:right;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">$3.04</div>
      </div>
    
      <div class="row" style="padding:12px 4px;border-bottom:1px solid var(--bd)">
        <div style="flex:3;font-size:14px">Suede chore</div>
        <div style="flex:1;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">8×</div>
        <div style="flex:1;text-align:right;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums">$67.50</div>
      </div>
    
  </div>
