<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Motion vocabulary</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:240px}</style>
</head><body><div class="card">
  <div class="eyebrow">Brand · Motion · confirms, never decorates</div>
  <div class="col" style="gap:8px">
    <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--bd)"><span style="font-size:13px">Section entrance</span><span class="mono" style="font-size:11px;color:var(--mu)">opacity 0→1 · y 20→0 · 500ms</span></div>
    <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--bd)"><span style="font-size:13px">Easing</span><span class="mono" style="font-size:11px;color:var(--mu)">cubic-bezier(0.22,1,0.36,1)</span></div>
    <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--bd)"><span style="font-size:13px">Stagger</span><span class="mono" style="font-size:11px;color:var(--mu)">0.07s between children</span></div>
    <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--bd)"><span style="font-size:13px">Hover</span><span class="mono" style="font-size:11px;color:var(--mu)">CSS · 200–300ms · color only</span></div>
    <div class="row between" style="padding:6px 0"><span style="font-size:13px;color:var(--dn)">Forbidden</span><span class="mono" style="font-size:11px;color:var(--dn)">bounce · scale-up · rotate · &gt;600ms</span></div>
  </div>
</div></body></html>
