<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Spacing tokens</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:280px}</style>
</head><body><div class="card">
  <div class="eyebrow">Spacing · 6 tokens</div>
  <div class="col" style="gap:8px">
    
      <div class="row" style="gap:14px;align-items:center"><div style="width:120px"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">section</span></div><div style="height:8px;background:var(--fg);width:160px"></div><span class="mono" style="font-size:10px;color:var(--mu)">160px</span></div>
    
      <div class="row" style="gap:14px;align-items:center"><div style="width:120px"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">section-sm</span></div><div style="height:8px;background:var(--fg);width:96px"></div><span class="mono" style="font-size:10px;color:var(--mu)">96px</span></div>
    
      <div class="row" style="gap:14px;align-items:center"><div style="width:120px"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">gutter</span></div><div style="height:8px;background:var(--fg);width:56px"></div><span class="mono" style="font-size:10px;color:var(--mu)">56px</span></div>
    
      <div class="row" style="gap:14px;align-items:center"><div style="width:120px"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">block</span></div><div style="height:8px;background:var(--fg);width:32px"></div><span class="mono" style="font-size:10px;color:var(--mu)">32px</span></div>
    
      <div class="row" style="gap:14px;align-items:center"><div style="width:120px"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">tight</span></div><div style="height:8px;background:var(--fg);width:16px"></div><span class="mono" style="font-size:10px;color:var(--mu)">16px</span></div>
    
      <div class="row" style="gap:14px;align-items:center"><div style="width:120px"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">hair</span></div><div style="height:8px;background:var(--fg);width:8px"></div><span class="mono" style="font-size:10px;color:var(--mu)">8px</span></div>
    
  </div>
</div></body></html>
