<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Radius — sharp by default</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:220px}</style>
</head><body><div class="card">
  <div class="eyebrow">Spacing · Radius rules</div>
  <div class="row" style="gap:18px;align-items:flex-end">
    <div class="col" style="gap:6px">
      <div style="width:100px;height:60px;background:var(--fg)"></div>
      <span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">Default</span>
      <span class="mono" style="font-size:10px;color:var(--mu)">radius: 0</span>
    </div>
    <div class="col" style="gap:6px">
      <div style="width:100px;height:60px;background:var(--s1);border:1px solid var(--bd)"></div>
      <span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">Card</span>
      <span class="mono" style="font-size:10px;color:var(--mu)">radius: 0</span>
    </div>
    <div class="col" style="gap:6px">
      <span class="chip-pill">archived</span>
      <span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.18em">Status pill</span>
      <span class="mono" style="font-size:10px;color:var(--mu)">rounded-full · only exception</span>
    </div>
  </div>
</div></body></html>
