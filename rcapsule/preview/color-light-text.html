<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Color — borders & text</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:200px}</style>
</head><body><div class="card">
  <div class="eyebrow">Colors · Light mode · Borders & muted</div>
  <div class="row" style="gap:14px">
    <div class="row" style="gap:10px"><div class="swatch" style="background:#E5E3DC"></div><div class="label-stack"><span class="name">Border</span><span class="hex">#E5E3DC</span><span class="use">Hairline</span></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="background:#0A0A0A"></div><div class="label-stack"><span class="name">Border-strong</span><span class="hex">#0A0A0A</span><span class="use">Section rule</span></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="background:#6B6B66"></div><div class="label-stack"><span class="name">Muted</span><span class="hex">#6B6B66</span><span class="use">Secondary text</span></div></div>
    <div class="row" style="gap:10px"><div class="swatch" style="background:#A8A8A2"></div><div class="label-stack"><span class="name">Mute-2</span><span class="hex">#A8A8A2</span><span class="use">Placeholder</span></div></div>
  </div>
</div></body></html>
