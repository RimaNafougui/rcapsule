<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Inputs — bordered, no radius</title>
<link rel="stylesheet" href="_shared.css"/>
<style>body{min-height:320px}</style>
</head><body><div class="card">
  <div class="eyebrow">Components · Inputs · h-11 · variant="bordered" · radius="none"</div>
  <div class="col" style="gap:14px">
    <div class="col" style="gap:6px">
      <span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.20em;color:var(--mu)">Item name</span>
      <input class="input" placeholder="Charcoal overcoat"/>
    </div>
    <div class="col" style="gap:6px">
      <span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.20em;color:var(--mu)">Brand — focused</span>
      <input class="input focus" value="MFG · Glasgow"/>
    </div>
    <div class="col" style="gap:6px">
      <span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:0.20em;color:var(--dn)">Price — error</span>
      <input class="input error" value="abc"/>
      <span style="font-size:12px;color:var(--dn)">That price isn't valid.</span>
    </div>
  </div>
</div></body></html>
